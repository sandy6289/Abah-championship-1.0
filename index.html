<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.B.A.H Championship 1.0</title>
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #000; color: #f5f5f5; min-height: 100vh; }
h1,h2,h3 { margin: 0; }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
.card { background: #0d0d0d; border: 1px solid #1f1f1f; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.neon { color: #c6ff00; text-shadow: 0 0 12px rgba(198,255,0,.45); }
.title { font-size: 26px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.muted { color: #777; font-size: 13px; }
input { width: 100%; padding: 12px; margin: 6px 0; background: #111; color: #fff; border: 1px solid #2a2a2a; border-radius: 10px; font-size: 16px; }
button { cursor: pointer; border: none; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 700; background: #1a1a1a; color: #fff; transition: transform .08s; }
button:active { transform: scale(.97); }
button:disabled { opacity: .3; cursor: not-allowed; }
.primary { background: #c6ff00; color: #000; box-shadow: 0 0 16px rgba(198,255,0,.35); }
.danger { background: #ff2e63; color: #fff; }
.bids { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.bids button { background: linear-gradient(135deg,#1c1c1c,#0a0a0a); border: 1px solid #c6ff0055; color: #c6ff00; }
.big { font-size: 44px; font-weight: 900; }
.player { font-size: 28px; font-weight: 800; margin: 6px 0; }
.tag { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #1a1a1a; border: 1px solid #333; font-size: 12px; margin: 2px; }
.err { color: #ff2e63; font-size: 14px; min-height: 18px; margin-top: 6px; }
.row { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #161616; font-size: 14px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" class="card" style="margin-top:40px">
    <div class="title neon">A.B.A.H Championship 1.0</div>
    <p class="muted">Log in as a captain or host</p>
    <input id="uid" placeholder="User ID" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" style="width:100%;margin-top:6px" onclick="login()">Login</button>
    <div id="loginErr" class="err"></div>
  </div>

  <div id="appView" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div>
          <div class="title neon">A.B.A.H Championship 1.0</div>
          <div class="muted" id="whoami"></div>
        </div>
        <div style="display:flex;gap:8px">
          <button onclick="enableSound()" style="padding:8px 12px">Sound On</button>
          <button onclick="logout()" style="padding:8px 12px">Logout</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="muted" id="progress"></div>
      <div class="player" id="curName">Waiting...</div>
      <div class="big neon" id="timer" style="font-size:22px"></div>
      <div class="muted">Current bid</div>
      <div class="big neon" id="curBid">0</div>
      <div class="muted" id="highBidder"></div>

      <div id="captainBids" class="hidden"><div class="bids" id="bidButtons"></div></div>

      <div id="hostControls" class="hidden" style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="primary" onclick="sellPlayer()">Sold</button>
        <button class="danger" onclick="unsoldPlayer()">Unsold</button>
        <button onclick="startAuction()" id="startBtn">Start Auction</button>
        <button onclick="resetBid()">Reset Bid</button>
      </div>
      <div id="bidErr" class="err"></div>
    </div>

    <div class="card">
      <h2 class="neon" style="font-size:18px;margin-bottom:10px">Teams</h2>
      <div id="teams"></div>
    </div>

    <div class="card">
      <h2 class="neon" style="font-size:18px;margin-bottom:10px">Remaining Players</h2>
      <div id="remaining"></div>
    </div>
  </div>
</div>

<canvas id="fx" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50"></canvas>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ===== FIREBASE =====
firebase.initializeApp({ databaseURL: "https://abah-championship-default-rtdb.firebaseio.com" });
const rtdb = firebase.database();

// ===== CONFIG =====
const BID_INCREMENTS = [50, 100, 200, 300, 400, 500];
const TIMER_MS = 20000; // 20 seconds per player, reset on every bid
const BUDGET = 7000;

const ACCOUNTS = [
  { id: "pranjal",   name: "Pranjal",   role: "captain", pw: "pranjal@2026" },
  { id: "sandy",     name: "Sandy",     role: "captain", pw: "sandy@2026" },
  { id: "zafran",    name: "Zafran",    role: "captain", pw: "zafran@2026" },
  { id: "saptarsha", name: "Saptarsha", role: "captain", pw: "saptarsha@2026" },
  { id: "naman",     name: "Naman",     role: "captain", pw: "naman@2026" },
  { id: "shivam",    name: "Shivam",    role: "captain", pw: "shivam@2026" },
  { id: "host",      name: "Host",      role: "host",    pw: "host@2026" }
];

const PLAYER_NAMES = [
  "Akash Mallick","Suraj","Jaggik","Akash Sonu",
  "Ghosh","Vishal","Siddharth",
  "Abhra Da","Joy","Akash Mondal","Souryadeep","Tarun","Akib","Naha","Souvik","Akshat","Rajkumar",
  "Subhro Roy","Ankan Baidya","Uddipto","Rahul","Nabu Da","Bikrant","Bunty Da","Haka",
  "Arnab","Aditya","Turnak","Anikesh","Shalin"
];

// ===== STATE =====
let me = null;
let state = null;
let bidDocs = [];

function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function defaultState() {
  return {
    started: false,
    idx: 0,
    players: shuffle(PLAYER_NAMES).map(n => ({ name: n, owner: "", price: 0, status: "pending" })),
    bidResetAt: 0
  };
}
function spentBy(id) { return (state.players || []).filter(p => p.owner === id).reduce((s, p) => s + (p.price || 0), 0); }
function remainingBudget(id) { return BUDGET - spentBy(id); }

// Each bid is its own record. Highest amount wins on every screen; tie goes to the earlier bid.
function bidInfo() {
  let best = null;
  bidDocs.forEach(function (b) {
    if (!b || b.idx !== state.idx || b.t <= (state.bidResetAt || 0)) return;
    if (!best || b.amount > best.amount || (b.amount === best.amount && b.t < best.t)) best = b;
  });
  return best ? { amount: best.amount, bidder: best.bidder } : { amount: 0, bidder: "" };
}

async function placeBidDoc(amount) {
  const bid = { idx: state.idx, amount: amount, bidder: me.id, t: Date.now() };
  try { await rtdb.ref("auction/bids").push(bid); await save({ timerEndsAt: Date.now() + TIMER_MS }); }
  catch (e) { document.getElementById("bidErr").textContent = "Bid did not save, try again"; }
}

// ===== LOGIN =====
function login() {
  const id = document.getElementById("uid").value.trim().toLowerCase();
  const pw = document.getElementById("pw").value;
  const acc = ACCOUNTS.find(a => a.id === id && a.pw === pw);
  if (!acc) { document.getElementById("loginErr").textContent = "Wrong ID or password"; return; }
  me = acc;
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  document.getElementById("whoami").textContent = `${acc.name} (${acc.role === "host" ? "Host" : "Captain"})`;
  startListening();
  render();
}
function logout() { location.reload(); }

// ===== REALTIME DATA =====
let listening = false;
function startListening() {
  if (listening) return;
  listening = true;
  rtdb.ref("auction/bids").on("value", function (snap) {
    bidDocs = Object.values(snap.val() || {});
    render();
  });
  rtdb.ref("auction/state").on("value", function (snap) {
    const data = snap.val();
    if (!data) {
      state = defaultState();
      if (me.role === "host") rtdb.ref("auction/state").set(state);
    } else {
      state = data;
      state.players = state.players || [];
    }
    render();
  }, function (err) {
    document.getElementById("bidErr").textContent = "Connection problem: " + (err.message || "");
  });
}

async function save(patch) {
  try { await rtdb.ref("auction/state").update(patch); }
  catch (e) { document.getElementById("bidErr").textContent = "Not saved, try again"; }
}

// ===== ACTIONS =====
async function startAuction() {
  if (me.role !== "host") return;
  const fresh = defaultState();
  fresh.started = true;
  fresh.timerEndsAt = Date.now() + TIMER_MS;
  await rtdb.ref("auction/state").set(fresh);
  await rtdb.ref("auction/bids").remove();
}

async function placeBid(amount) {
  document.getElementById("bidErr").textContent = "";
  if (!state.started) return;
  const current = state.players[state.idx];
  if (!current || current.status !== "pending") return;
  if (amount <= state.currentBid) { document.getElementById("bidErr").textContent = "Bid must be higher than the current bid"; return; }
  if (amount > remainingBudget(me.id)) { document.getElementById("bidErr").textContent = "Not enough budget left for this bid"; return; }
  await placeBidDoc(amount);
}

async function resetBid() {
  if (me.role !== "host") return;
  await save({ bidResetAt: Date.now() });
}

async function sellPlayer() {
  if (me.role !== "host" || !state.started) return;
  if (!state.highBidder) { document.getElementById("bidErr").textContent = "No bids yet"; return; }
  const sold = state.players[state.idx];
  const players = state.players.map((p, i) => i === state.idx
    ? { ...p, status: "sold", owner: state.highBidder, price: state.currentBid } : p);
  await save({ players: players, idx: nextPendingIndex(players, state.idx), timerEndsAt: Date.now() + TIMER_MS,
    lastSale: { name: sold.name, owner: state.highBidder, price: state.currentBid, t: Date.now() } });
}

async function unsoldPlayer() {
  if (me.role !== "host" || !state.started) return;
  const players = state.players.map((p, i) => i === state.idx ? { ...p, status: "unsold" } : p);
  await save({ players: players, idx: nextPendingIndex(players, state.idx), timerEndsAt: Date.now() + TIMER_MS });
}

function nextPendingIndex(players, from) {
  for (let i = from + 1; i < players.length; i++) if (players[i].status === "pending") return i;
  for (let i = 0; i < players.length; i++) if (players[i].status === "pending") return i;
  return from;
}

// ===== CELEBRATION =====
let lastSaleSeen = 0;
let audioCtx = null;

function enableSound() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    g.gain.value = 0.05;
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.15);
  } catch (e) { }
}

function checkCelebrate() {
  const s = state && state.lastSale;
  if (!s || !s.t) return;
  if (lastSaleSeen === 0) { lastSaleSeen = s.t; return; }
  if (s.t === lastSaleSeen) return;
  lastSaleSeen = s.t;
  const owner = ACCOUNTS.find(a => a.id === s.owner);
  celebrate(s.name + " sold to " + (owner ? owner.name : "") + " for " + s.price);
}

function playJingle() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const notes = [392, 392, 523, 659, 523, 659, 784, 784, 880, 784, 659, 523];
    const t0 = audioCtx.currentTime;
    notes.forEach(function (f, i) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "square";
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + i * 0.4);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + i * 0.4 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.4 + 0.38);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + i * 0.4);
      o.stop(t0 + i * 0.4 + 0.4);
    });
  } catch (e) { }
}

function celebrate(text) {
  playJingle();
  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#c6ff00", "#ff2e63", "#00e5ff", "#ffd600", "#b388ff", "#ffffff"];
  const pieces = Array.from({ length: 180 }, function () {
    return { x: cv.width / 2, y: cv.height / 2, vx: (Math.random() - 0.5) * 22, vy: -Math.random() * 22 - 4,
      s: Math.random() * 8 + 4, r: Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)] };
  });
  const start = performance.now();
  function frame(now) {
    const el = now - start;
    ctx.clearRect(0, 0, cv.width, cv.height);
    pieces.forEach(function (p) {
      p.vy += 0.5; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.r += 0.2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    });
    if (text && el < 3000) {
      ctx.font = "900 " + Math.round(cv.width / 14) + "px system-ui";
      ctx.textAlign = "center";
      ctx.fillStyle = "#c6ff00";
      ctx.shadowColor = "#c6ff00"; ctx.shadowBlur = 24;
      ctx.fillText(text, cv.width / 2, cv.height / 3);
      ctx.shadowBlur = 0;
    }
    if (el < 5000) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  }
  requestAnimationFrame(frame);
}

// ===== RENDER =====
function render() {
  if (!me || !state) return;
  checkCelebrate();
  const bi = bidInfo();
  state.currentBid = bi.amount;
  state.highBidder = bi.bidder;

  const cur = state.players[state.idx];
  const done = state.players.filter(p => p.status !== "pending").length;

  document.getElementById("hostControls").classList.toggle("hidden", me.role !== "host");
  document.getElementById("captainBids").classList.toggle("hidden", me.role === "host");
  document.getElementById("progress").textContent = state.started ? `${done} / ${state.players.length} players done` : "Auction not started yet";
  document.getElementById("curName").textContent = cur && state.started
    ? (cur.status === "pending" ? cur.name : "All players done") : "Waiting...";
  document.getElementById("curBid").textContent = state.currentBid || 0;
  const hb = ACCOUNTS.find(a => a.id === state.highBidder);
  document.getElementById("highBidder").textContent = hb ? `Highest bidder: ${hb.name}` : "No bids yet";
  document.getElementById("startBtn").textContent = state.started ? "Reset Auction" : "Start Auction";

  if (me.role !== "host") {
    const wrap = document.getElementById("bidButtons");
    const live = state.started && cur && cur.status === "pending";
    wrap.innerHTML = "";
    BID_INCREMENTS.forEach(inc => {
      const amount = state.currentBid + inc;
      const b = document.createElement("button");
      b.textContent = "+" + inc;
      b.disabled = !live || amount > remainingBudget(me.id);
      b.onclick = () => placeBid(amount);
      wrap.appendChild(b);
    });
  }

  const teamsEl = document.getElementById("teams");
  teamsEl.innerHTML = "";
  ACCOUNTS.filter(a => a.role === "captain").forEach(c => {
    const bought = state.players.filter(p => p.owner === c.id);
    const box = document.createElement("div");
    box.style.marginBottom = "12px";
    box.innerHTML = `<div style="font-weight:800" class="neon">${c.name} <span class="muted">· ${bought.length} players · budget left ${remainingBudget(c.id)}</span></div>`
      + (bought.map(p => `<div class="row"><span>${p.name}</span><span class="neon">${p.price}</span></div>`).join("") || `<div class="muted">No players yet</div>`);
    teamsEl.appendChild(box);
  });

  const rem = state.players.filter(p => p.status === "pending");
  document.getElementById("remaining").innerHTML = rem.length
    ? rem.map(p => `<span class="tag">${p.name}</span>`).join("")
    : `<div class="muted">No players left</div>`;
}

let resolving = false;
setInterval(function () {
  if (!me || !state || !state.started) return;
  const cur = state.players[state.idx];
  const live = cur && cur.status === "pending";
  const ends = state.timerEndsAt || 0;
  const left = Math.max(0, Math.ceil((ends - Date.now()) / 1000));
  const el = document.getElementById("timer");
  if (el) el.textContent = live ? left + "s" : "";
  if (me.role === "host" && live && ends && Date.now() >= ends && !resolving) {
    resolving = true;
    (state.highBidder ? sellPlayer() : unsoldPlayer()).finally(function () {
      setTimeout(function () { resolving = false; }, 2000);
    });
  }
}, 500);
</script>
</body>
</html>
